logging.level.root=WARN
logging.level.de.lukasbreuer.nightshift=INFO
spring.main.banner-mode=off
spring.threads.virtual.enabled=true
server.servlet.contextPath=/v1
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.async.request-timeout=120000

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:nightshift}
spring.datasource.username=${DB_USERNAME:nightshift}
spring.datasource.password=${DB_PASSWORD:nightshift}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

nightshift.secure-cookies=${SECURE_COOKIES:false}